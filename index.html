<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Chữ Nhảy Theo Nhạc CapCut</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Be Vietnam Pro', sans-serif; }
    body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 16px; min-height: 100vh; }
    h2 { font-size: 18px; margin-bottom: 12px; color: #00f2fe; text-align: center; }
    
    #preview-box {
      width: 100%; max-width: 400px; height: 260px; background: #000000;
      border: 1px solid #333; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      text-align: center; overflow: hidden; position: relative; margin-bottom: 16px;
    }
    #preview-text {
      font-size: 28px; color: #ffffff; word-break: break-word;
      white-space: pre-wrap; line-height: 1.4; transition: transform 0.06s ease-out;
    }

    @keyframes fadeAnim { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes floatAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes beatDemo { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } 60% { transform: scale(1); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .anim-fade { animation: fadeAnim 2.5s infinite ease-in-out; }
    .anim-float { animation: floatAnim 2.5s infinite ease-in-out; }
    .anim-beat-demo { animation: beatDemo 1.2s infinite ease-out; }

    .controls { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    textarea {
      width: 100%; height: 75px; padding: 12px; border-radius: 8px;
      border: 1px solid #444; background: #1e1e1e; color: #fff; font-size: 15px; resize: none;
    }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    select, input[type="range"] { flex: 1; padding: 10px; border-radius: 8px; background: #1e1e1e; color: #fff; border: 1px solid #444; }
    input[type="color"] { width: 44px; height: 40px; border: none; border-radius: 8px; background: none; cursor: pointer; }
    
    .audio-box {
      background: #1e1e1e; border: 1px dashed #00f2fe; border-radius: 8px;
      padding: 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .audio-label {
      display: block; text-align: center; background: #00f2fe; color: #000;
      padding: 10px; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    #status-bar {
      display: flex; font-size: 13px; padding: 8px 10px; border-radius: 6px;
      background: #252525; color: #aaa; align-items: center; gap: 8px;
    }
    .spinner {
      display: none; width: 16px; height: 16px; border: 2px solid #ffd700;
      border-top: 2px solid transparent; border-radius: 50%;
      animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    video { width: 100%; height: 46px; display: none; border-radius: 6px; background: #000; }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      padding: 12px; border: none; border-radius: 8px; font-weight: 700;
      font-size: 14px; cursor: pointer; transition: 0.2s;
    }
    .btn-black { background: #000; color: #fff; border: 1px solid #555; }
    .btn-green { background: #00b140; color: #fff; }
    .btn-glow { background: #2a2a2a; color: #ffd700; border: 1px solid #555; }
    .btn-demo { background: #3b2d54; color: #e0b0ff; border: 1px solid #7c4dff; grid-column: span 2; }
    .btn-download { background: linear-gradient(90deg, #00f2fe, #4facfe); color: #000; grid-column: span 2; font-size: 15px; }
    .btn-full { background: #333; color: #fff; grid-column: span 2; }
    
    .fullscreen-mode #preview-box {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      max-width: none; border-radius: 0; border: none; z-index: 999;
    }
    #exit-full {
      display: none; position: fixed; top: 20px; right: 20px; z-index: 1000;
      background: rgba(255,255,255,0.2); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 12px;
    }
    .fullscreen-mode #exit-full { display: block; }
  </style>
</head>
<body>

  <h2>🎵 TẠO CHỮ NHẢY THEO NHẠC 🎵</h2>
  <button id="exit-full" onclick="toggleFull()">✕ Thoát toàn màn hình</button>

  <div id="preview-box">
    <div id="preview-text">Mưa rơi vào phòng...</div>
  </div>

  <div class="controls">
    <div class="audio-box">
      <label class="audio-label" for="media-upload">📂 Chọn Video / Nhạc từ Trình quản lý tệp</label>
      <input type="file" id="media-upload" style="display:none;">
      
      <div id="status-bar">
        <div id="spinner-icon" class="spinner"></div>
        <span id="status-text">⚪ Đang chờ chọn tệp...</span>
      </div>

      <video id="media-player" controls loop playsinline></video>
    </div>

    <textarea id="text-input" placeholder="Nhập lời bài hát hoặc câu nói..." oninput="updateText()">Mưa rơi vào phòng...</textarea>

    <div class="row">
      <select id="font-select" onchange="updateStyle()">
        <option value="'Dancing Script', cursive">Chữ viết tay mềm mại</option>
        <option value="'Pacifico', cursive">Chữ nghệ thuật uốn lượn</option>
        <option value="'Playfair Display', serif">Chữ nghiêng điện ảnh</option>
        <option value="'Montserrat', sans-serif">Chữ hiện đại sắc nét</option>
        <option value="'Be Vietnam Pro', sans-serif">Chữ đơn giản mặc định</option>
      </select>
      <input type="color" id="color-picker" value="#ffffff" onchange="updateStyle()">
    </div>

    <div class="row">
      <span style="font-size: 13px; color: #aaa;">Cỡ chữ:</span>
      <input type="range" id="size-slider" min="18" max="60" value="28" oninput="updateStyle()">
      <select id="anim-select" onchange="updateAnim()" style="max-width: 155px;">
        <option value="beat">Nhảy theo nhịp Bass</option>
        <option value="anim-beat-demo">Nhảy nhịp Remix tự động</option>
        <option value="">Tĩnh (Không nhảy)</option>
        <option value="anim-fade">Hiện mờ dần</option>
        <option value="anim-float">Lơ lửng</option>
      </select>
    </div>

    <div class="btn-group">
      <button class="btn-black" onclick="setBg('#000000')">⬛ Nền Đen</button>
      <button class="btn-green" onclick="setBg('#00FF00')">🟩 Phông Xanh</button>
      <button class="btn-glow" onclick="toggleGlow()" style="grid-column: span 2;">🌟 Bật / Tắt viền phát sáng</button>
      <button class="btn-full" onclick="playAndFull()">▶️ Phóng To Toàn Màn Hình (Để quay video)</button>
      <button class="btn-download" onclick="downloadImage()">⬇️ Tải Ảnh Chữ Tĩnh (PNG)</button>
    </div>
  </div>

  <script>
    let currentBg = '#000000';
    let isGlow = false;
    let audioCtx, analyser, source, dataArray;
    let isBeatMode = true;
    let analyzerWorking = false;

    const previewBox = document.getElementById('preview-box');
    const previewText = document.getElementById('preview-text');
    const mediaPlayer = document.getElementById('media-player');
    const statusBar = document.getElementById('status-bar');
    const statusText = document.getElementById('status-text');
    const spinnerIcon = document.getElementById('spinner-icon');
    const fileInput = document.getElementById('media-upload');

    fileInput.addEventListener('click', function() {
      this.value = '';
      spinnerIcon.style.display = 'block';
      statusBar.style.color = '#ffd700';
      statusText.innerText = '⏳ Đang mở bộ nhớ máy để chọn tệp...';
    });

    fileInput.addEventListener('change', function() {
      if (!this.files || this.files.length === 0) {
        spinnerIcon.style.display = 'none';
        statusBar.style.color = '#aaa';
        statusText.innerText = '⚪ Đã hủy chọn tệp';
        return;
      }
      const file = this.files.item(0);
      statusText.innerText = '⏳ Đang nạp: ' + file.name;

      const url = URL.createObjectURL(file);
      mediaPlayer.src = url;
      mediaPlayer.style.display = 'block';

      mediaPlayer.onloadedmetadata = function() {
        spinnerIcon.style.display = 'none';
        statusBar.style.color = '#00ff88';
        statusText.innerText = '✅ Đã xong! Bấm nút Play ở thanh dưới';
        setupAudioAnalyzer();
        mediaPlayer.play().catch(function() {});
      };

      mediaPlayer.onerror = function() {
        spinnerIcon.style.display = 'none';
        statusBar.style.color = '#ff4d4d';
        statusText.innerText = '❌ Không hỗ trợ định dạng này!';
      };
    });

    function setupAudioAnalyzer() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
          analyser = audioCtx.createAnalyser();
          source = audioCtx.createMediaElementSource(mediaPlayer);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          analyser.fftSize = 64;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          analyzerWorking = true;
          animateBeat();
        }
      } catch (e) {
        analyzerWorking = false;
      }
    }

    function animateBeat() {
      requestAnimationFrame(animateBeat);
      if (isBeatMode && !mediaPlayer.paused) {
        if (analyzerWorking && analyser) {
          analyser.getByteFrequencyData(dataArray);
          let bass = (dataArray.at(0) + dataArray.at(1) + dataArray.at(2)) / 3;
          if (bass > 0) {
            previewText.classList.remove('anim-beat-demo');
